<div class="modal-overlay" *ngIf="isVisible" (click)="onCancel()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" [disabled]="isLoading" (click)="onCancel()">&times;</button>
    </div>
    <div class="modal-body">
      <p>{{ message }}</p>
    </div>
    <div class="modal-footer">
      <button class="btn-icon" [disabled]="isLoading" (click)="onCancel()">Cancelar</button>
      <button class="primary danger" [disabled]="isLoading" (click)="onConfirm()">
        <span *ngIf="isLoading" class="btn-spinner"></span>
        <span *ngIf="!isLoading">Aceptar</span>
      </button>
    </div>
  </div>
</div>
